</head>
<body>

    <!-- Header -->
    <header>
        <!-- navBar -->
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container-fluid px-5">
                <a class="navbar-brand" href="#"><img src="../assets/img/impulsarLG.png" alt="Impulsar - Diseño Gráfico y Desarrollo Web"></a>
                
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                
                <div class="collapse navbar-collapse" id="navbarNavDropdown">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="../index.html">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="./hola.html">Hola!</a>

                            <a class="nav-link" href="./galeria.html">Galería</a>

                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#">Contacto</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main -->
    <main class="container-fluid">
        <div class="row contenedorContactos">
            <!-- Columna Izquierda -->
            <div class="contactoIzquierda col-lg-6 col-md-6 col-sm-12">
                <h1 class="fs-1"  data-aos="flip-up" data-aos-duration="1500">Contacto</h1>
                <div>
                    <div>
                        <p>
                            <strong>Cel.:</strong><br>
                            +54 9 11 6253 2562<br>
                            <strong>E-mail:</strong><br>
                            impulsarbsas@gmail.com
                        </p>
                    </div>
                    <div class="codigoWhatapp">
                        <img src="../assets/img/codigoWapp.png" alt="Código WhatsApp para que puedas agendarme!">
                    </div>
                </div>
            </div>

            <!-- Columna Derecha -->
            <div class="col-lg-6 col-md-6 col-sm-12 contactoDerecha">
                <h2>Enviame tu consulta</h2>
                <form action="#" method="POST" class="formulario-contacto ampliarForm">

                    <div class="campo">
                        <label for="nombre">Nombre y apellido</label>
                        <input type="text" id="nombre" name="nombre" required autocomplete="name">
                    </div>

                    <div class="campo">
                        <label for="email">Correo electrónico</label>
                        <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        aria-describedby="email-help" 
                        required 
                        autocomplete="email"
                        >
                        <small id="email-help">Te responderemos a esta casilla en menos de 24 hs.</small>
                    </div>

                    <div class="campo">
                        <label for="motivo">Motivo de contacto</label>
                        <select id="motivo" name="motivo" required>
                        <option value="">Seleccioná una opción...</option>
                        <option value="consulta">Consulta general</option>
                        <option value="presupuesto">Presupuesto</option>
                        <option value="soporte">Soporte</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="mensaje">Tu mensaje</label>
                        <textarea id="mensaje" name="mensaje" rows="4" required></textarea>
                    </div>

                    <button type="submit" class="btnEnviar">Enviar consulta</button>

                </form>
            </div>
        </div>
    </main>
    <!--Footer -->
    <footer class="container-fluid py-3 px-4 px-lg-5">
        <div class="row align-items-center text-center text-lg-start">
            <!-- Columna 1: Logo -->
            <div class="col-lg-4 col-md-4 col-12 mb-3 mb-md-0">
                <img src="../assets/img/impulsarLG_footer.png" alt="Logo de Impulsar" class="img-fluid">
            </div>

            <!-- Columna 2: Copyright -->
            <div class="col-lg-4 col-md-4 col-12 mb-3 mb-md-0 text-center">
                <p class="mb-0">© 2026 Copyright: Elena Osuna</p>
            </div>

            <!-- Columna 3: Redes Sociales -->
            <div class="col-lg-4 col-md-4 col-12 text-center text-lg-end">
                <a href="https://www.linkedin.com/in/elena-osuna/" target="_blank" rel="noopener noreferrer" class="me-2">
                    <img src="../assets/img/bot_link.png" alt="Visita mi perfil de LinkedIn">
                </a>
                <a href="https://www.instagram.com/impulsardg/" target="_blank" rel="noopener noreferrer" class="me-2">
                    <img src="../assets/img/bot_inst.png" alt="Visita la página de Instagram">
                </a>
                <a href="https://www.facebook.com/impulsardg" target="_blank" rel="noopener noreferrer">
                    <img src="../assets/img/bot_facebk.png" alt="Visita la página de Facebook">
                </a>
            </div>
        </div> 
    </footer>
    <!-- AOS SCRIPT -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

        AOS.init();

</body>
</html>
